[project]
name = "trading-mcp"
version = "0.1.0"
description = "過去データのパターン検証・インジケータ計算MCPサーバー"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "yfinance>=0.2.50",
    "pandas-ta>=0.3.14b0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[project.scripts]
trading-mcp = "trading_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
